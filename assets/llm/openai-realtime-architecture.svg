<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
  <title id="title">端到端语音架构与 WebRTC 接入</title>
  <desc id="desc">串联架构依次使用语音识别、文字模型和语音合成；原生语音模型直接接收音频并输出音频。浏览器通过应用服务器协商连接，音频和控制事件直接连接 OpenAI，应用服务器可以通过旁路连接执行工具。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#51716b" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1000" height="730" rx="18" fill="#f6f8f4"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" fill="#183d36">
    <text x="40" y="53" font-size="26" font-weight="700">声音如何成为一次对话</text>
    <text x="40" y="82" font-size="15" fill="#536d66">接口层面的职责示意，不代表模型内部网络结构</text>
    <text x="40" y="125" font-size="17" font-weight="650">串联语音架构</text>
    <g fill="#fff" stroke="#becfc4" stroke-width="1.5">
      <rect x="40" y="143" width="150" height="60" rx="10"/><rect x="233" y="143" width="150" height="60" rx="10"/>
      <rect x="425" y="143" width="150" height="60" rx="10"/><rect x="618" y="143" width="150" height="60" rx="10"/>
      <rect x="810" y="143" width="150" height="60" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="18">
      <text x="115" y="180">用户声音</text><text x="308" y="180">语音识别</text><text x="500" y="180">文字模型</text><text x="693" y="180">语音合成</text><text x="885" y="180">回答声音</text>
    </g>
    <g stroke="#51716b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M195 173h30"/><path d="M388 173h29"/><path d="M580 173h30"/><path d="M773 173h29"/>
    </g>
    <text x="40" y="250" font-size="17" font-weight="650">原生语音架构</text>
    <g stroke="#86ad9d" stroke-width="1.5">
      <rect x="40" y="269" width="190" height="70" rx="10" fill="#fff"/>
      <rect x="330" y="269" width="340" height="70" rx="10" fill="#d9e9dd"/>
      <rect x="770" y="269" width="190" height="70" rx="10" fill="#fff"/>
    </g>
    <g text-anchor="middle" font-size="19">
      <text x="135" y="311">用户声音</text><text x="500" y="300">Realtime 对话模型</text><text x="500" y="325" font-size="15">处理音频、生成回答、选择工具</text><text x="865" y="311">回答声音</text>
    </g>
    <g stroke="#51716b" stroke-width="2" marker-end="url(#arrow)"><path d="M238 304h80"/><path d="M678 304h80"/></g>
    <path d="M40 374H960" stroke="#ccd9d0"/>
    <text x="40" y="414" font-size="22" font-weight="700">WebRTC 应用的数据流</text>
    <rect x="40" y="452" width="235" height="100" rx="12" fill="#fff" stroke="#becfc4"/>
    <rect x="725" y="452" width="235" height="100" rx="12" fill="#d9e9dd" stroke="#86ad9d"/>
    <rect x="340" y="609" width="320" height="80" rx="12" fill="#fff" stroke="#becfc4"/>
    <g text-anchor="middle" font-size="20">
      <text x="157" y="493">浏览器</text><text x="157" y="523" font-size="16">麦克风 · 播放器 · 字幕</text>
      <text x="842" y="493">OpenAI Realtime</text><text x="842" y="523" font-size="16">会话历史 · 回答生成</text>
      <text x="500" y="640">应用服务器</text><text x="500" y="669" font-size="16">API Key · 认证 · 业务工具</text>
    </g>
    <g fill="none" stroke="#51716b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M288 482H712"/><path d="M288 531H712"/>
      <path d="M162 563V649H327"/><path d="M673 649H841V563"/>
    </g>
    <g text-anchor="middle" font-size="15" fill="#536d66">
      <text x="500" y="473">媒体轨道：持续音频</text><text x="500" y="522">数据通道：JSON 控制事件</text>
      <text x="238" y="600">初始 SDP 协商</text><text x="773" y="600">建连 / 可选旁路控制</text>
    </g>
  </g>
</svg>
