<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
  <title id="title">GPT-Live 的语音与任务分工</title>
  <desc id="desc">用户和实时语音层保持对话。语音层将要求交给后台任务，后台执行模型与工具并返回进度。这是根据公开行为抽象的职责示意，不代表内部服务架构。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52756d"/></marker>
  </defs>
  <rect width="560" height="640" rx="18" fill="#f5f8f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="280" y="46" font-size="25" font-weight="600" fill="#193c34">对话持续进行，任务持续执行</text>
    <rect x="52" y="77" width="456" height="86" rx="12" fill="#ffffff" stroke="#cbd9d4"/>
    <text x="280" y="112" font-size="24" font-weight="600" fill="#193c34">用户</text>
    <text x="280" y="142" font-size="20" fill="#4b625a">提出要求 · 询问进度 · 随时补充</text>
    <path d="M 151 176 L 151 231" fill="none" stroke="#52756d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 409 231 L 409 176" fill="none" stroke="#52756d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="217" y="209" font-size="19" fill="#4b625a">说话</text>
    <text x="342" y="209" font-size="19" fill="#4b625a">回复</text>
    <rect x="52" y="245" width="456" height="109" rx="12" fill="#dff0e9" stroke="#7ca997"/>
    <text x="280" y="286" font-size="25" font-weight="600" fill="#193c34">实时语音层 · GPT-Live</text>
    <text x="280" y="321" font-size="21" fill="#395b4f">保持交谈，协调任务</text>
    <path d="M 151 368 L 151 438" fill="none" stroke="#52756d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 409 438 L 409 368" fill="none" stroke="#52756d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="217" y="397" font-size="19" fill="#4b625a">发起任务</text>
    <text x="217" y="423" font-size="19" fill="#4b625a">追加要求</text>
    <text x="342" y="397" font-size="19" fill="#4b625a">进度</text>
    <text x="342" y="423" font-size="19" fill="#4b625a">结果</text>
    <rect x="52" y="452" width="456" height="109" rx="12" fill="#e8edf7" stroke="#a6b6d3"/>
    <text x="280" y="493" font-size="25" font-weight="600" fill="#243d66">后台任务 · 任务模型与工具</text>
    <text x="280" y="528" font-size="21" fill="#4c5f7b">修改文件，运行检查，记录状态</text>
    <text x="280" y="600" font-size="18" fill="#52665f">按公开行为抽象，箭头仅表示功能关系</text>
  </g>
</svg>
